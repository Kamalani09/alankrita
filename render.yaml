services:
  - type: web
    name: alankrita-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --workspace server --include-workspace-root --omit=dev
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: SITE_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ENQUIRY_TRACKING_ENABLED
        value: "false"
      - key: SERVE_STOREFRONT
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "0"
